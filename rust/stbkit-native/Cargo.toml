[package]
name = "stbkit-native-rs"
version = "0.1.0-beta.5"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
serde_json = "1.0.154"
stbkit-rs = { path = "../stbkit-rs" }
uuid = { version = "1.28.0", features = ["v4"] }
