exclude_docs: |
  _templates/

theme:
  name: material
  language: ja
  font: false
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

docs_dir: docs
site_dir: site

watch:
  - python/stbkit/src
  - python/stbkit-core/src

use_directory_urls: true
strict: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      check_paths: true

plugins:
  - search:
      lang: ja
  - mkdocstrings:
      handlers:
        python:
          paths:
            - python/stbkit/src
            - python/stbkit-core/src
          options:
            docstring_style: google
            filters:
              - "!^_"
            heading_level: 2
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            signature_crossrefs: true




