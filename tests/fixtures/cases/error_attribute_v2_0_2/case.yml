id: error_attribute_v2_0_2
description: 未定義の属性を持つエラーケース（v2.0.2）

input:
  format: stb_v2_0_2
  compare-options:
    ignore-application-information: true
    # 拡張定義のない想定外属性は不正値として退避され、出力されない
    filter:
      element-attribute-filters:
        StbCommon:
          exclude-attributes:
            - err_attr
