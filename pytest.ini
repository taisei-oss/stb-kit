[pytest]
testpaths =
    python
required_plugins = pytest-env
addopts = -p stbkit.testutils.pytest_plugin
markers =
    ai_generated: AIによって生成されたテストであることを示すマーカー
    requires_xsd: XSDファイルを必要とするテスト。XSDの無い環境ではスキップする
    requires_ifcopenshell: 任意依存のifcopenshellを必要とするテスト。ifcopenshellの無い環境では -m "not requires_ifcopenshell" で除外する
    requires_rust: 任意依存のRustを必要とするテスト。Rustの無い環境ではスキップし、--require-rust指定時はエラーにする
