name: ci-other-os

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test-other-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12"]
        os: ["macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      - run: uv run --python "${{ matrix.python-version }}" --no-sync pytest
  python-test-no-ifc:
    # Python 3.15では依存エラーが生じるため、IFCのテストを除外
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]
        os: ["macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py-3.15
      - run: uv sync --locked --python "${{ matrix.python-version }}" --no-install-package ifcopenshell
      - run: uv run --python "${{ matrix.python-version }}" --no-sync pytest -m "not requires_ifcopenshell"
