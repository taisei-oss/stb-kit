name: Setup uv
inputs:
  python-version:
    required: false
    default: "3.14"
  cache-suffix:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        cache-suffix: ${{ inputs.cache-suffix }}
